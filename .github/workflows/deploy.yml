      - name: Build de production
        run: npm run build
        env:
          YOON_ENV: production
          YOON_RELEASE: ${{ github.sha }}
          YOON_SITE_URL: ${{ vars.YOON_SITE_URL }}
          YOON_PAYMENT_API: ${{ vars.YOON_PAYMENT_API }}
          YOON_REPORT_URL: ${{ vars.YOON_REPORT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
